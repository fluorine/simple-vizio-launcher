<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#f4f6f8;font-family:system-ui,Arial,sans-serif}main{height:100vh;display:flex;align-items:center;justify-content:center}.row{display:flex;gap:24px}button{width:24vw;height:28vh;border:3px solid #405363;border-radius:20px;background:#202d3c;color:white;font-size:27px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}button:focus{outline:6px solid #f5cd78;outline-offset:5px;background:#344b5c}.logo{height:72px;min-width:95px;display:flex;align-items:center;justify-content:center}.youtube svg{width:85px}.netflix .logo{font-family:Arial,sans-serif;font-weight:900;font-size:88px;line-height:1;color:#e50914}.prime .logo{font-family:Arial,sans-serif;font-size:37px;font-weight:700;color:#fff;position:relative}.prime .logo:after{content:'';position:absolute;border-bottom:5px solid #00a8e1;border-radius:50%;width:90px;height:25px;bottom:0;transform:rotate(-7deg)}.corner{position:fixed;right:4vw;bottom:5vh;width:auto;height:auto;padding:12px 18px;border-radius:12px;font-size:17px;flex-direction:row;gap:9px;color:#c7d2db;background:#182432}.corner .logo{height:25px;min-width:25px}.corner svg{width:25px}.corner:focus{outline-width:4px}.status{position:fixed;left:7vw;bottom:8vh;font-size:30px;font-weight:700;color:#f5cd78;max-width:70vw}
</style></head><body><main><div class="row">
<button class="youtube" data-app="youtube"><span class="logo"><svg viewBox="0 0 90 64" aria-hidden="true"><rect x="1" y="4" width="88" height="56" rx="15" fill="#ff0033"/><path d="M37 19v26l23-13z" fill="white"/></svg></span><span>YouTube</span></button>
<button class="netflix" data-app="netflix"><span class="logo" aria-hidden="true">N</span><span>Netflix</span></button>
<button class="prime" data-app="prime"><span class="logo" aria-hidden="true">prime</span><span>Prime Video</span></button>
</div><button class="stock corner" data-app="stock"><span class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M7 30 32 9l25 21M13 27v27h15V39h9v15h14V27" fill="none" stroke="#8bd0f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Vizio Home</span></button><div class="status" aria-live="polite"></div></main><script>
var buttons=Array.from(document.querySelectorAll('button')), selected=0, interacted=false, saveQueue=Promise.resolve();
function focus(){buttons[selected].focus();}
function save(){var app=buttons[selected].dataset.app;if(app==='stock')return saveQueue;saveQueue=saveQueue.catch(function(){}).then(function(){return fetch('/selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:app})});});return saveQueue;}
focus();
fetch('/selection').then(function(r){return r.json();}).then(function(v){if(interacted)return;var i=buttons.findIndex(function(b){return b.dataset.app===v.app;});if(i>=0){selected=i;focus();}}).catch(function(){});
document.addEventListener('keydown',function(e){var previous=selected;if(e.key==='ArrowRight'||e.keyCode===39){selected=Math.min(selected+1,buttons.length-1);}else if(e.key==='ArrowLeft'||e.keyCode===37){selected=Math.max(selected-1,0);}else if(e.key==='ArrowDown'||e.keyCode===40){selected=buttons.length-1;}else if(e.key==='ArrowUp'||e.keyCode===38){if(selected===buttons.length-1)selected=2;}else{return;}interacted=true;focus();if(previous!==selected)save();e.preventDefault();});
buttons.forEach(function(b,i){b.addEventListener('click',function(){interacted=true;selected=i;document.querySelector('.status').textContent='Opening '+b.innerText+'…';save().catch(function(){}).then(function(){return fetch('/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:b.dataset.app})});}).then(function(r){if(!r.ok)throw Error();}).catch(function(){document.querySelector('.status').textContent='Could not open. Please try again.';});});});
</script></body></html>
